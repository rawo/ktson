name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Cheap checks first, so a wrong tag fails in seconds instead of after a full build.
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on master
        run: |
          git fetch origin master
          TAG_COMMIT=$(git rev-list -n 1 "${{ github.ref_name }}")
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/master; then
            echo "::error::Tag ${{ github.ref_name }} is not on master branch, skipping release."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Verify tag matches the project version
        run: |
          VERSION=$(./gradlew -q properties --property version | awk '/^version:/ { print $2 }')
          if [ "v$VERSION" != "${{ github.ref_name }}" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match build.gradle.kts version $VERSION (expected v$VERSION)."
            exit 1
          fi
          echo "Tag ${{ github.ref_name }} matches version $VERSION"

  # The same build as CI on master: tests, the official suite at the pinned SHA, and ktlint.
  build:
    needs: check
    uses: ./.github/workflows/build.yml
    with:
      upload-jar: true

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download JARs
        uses: actions/download-artifact@v4
        with:
          name: ktson-jars
          path: dist

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_TAG="${{ github.ref_name }}"
          PREV_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty' 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            RANGE="$CURRENT_TAG"
          else
            RANGE="${PREV_TAG}..${CURRENT_TAG}"
          fi

          BREAKING=""
          FEATURES=""
          FIXES=""

          # Conventional Commits: type(scope)!: subject, plus BREAKING CHANGE: footers.
          # tformat (not format) terminates every record, so the oldest commit is not dropped.
          while IFS= read -r -d '' commit; do
            subject=$(printf '%s' "$commit" | head -n 1)
            body=$(printf '%s' "$commit" | tail -n +2)

            type=$(printf '%s' "$subject" | sed -n -E 's/^([a-z]+)(\([^)]*\))?!?:.*/\1/p')
            [ -n "$type" ] || continue

            # keep the scope as a bold label, drop the rest of the prefix
            description=$(printf '%s' "$subject" | sed -E 's/^[a-z]+\(([^)]+)\)!?: /**\1**: /; s/^[a-z]+!?: //')

            # a footer may wrap over several lines, so take everything from the marker onwards
            breaking_footer=$(printf '%s' "$body" \
              | awk '/^BREAKING[ -]CHANGE:/ { found = 1; sub(/^BREAKING[ -]CHANGE: */, "") } found' \
              | tr '\n' ' ' | sed -E 's/  +/ /g; s/ +$//')

            if printf '%s' "$subject" | grep -qE '^[a-z]+(\([^)]*\))?!:' || [ -n "$breaking_footer" ]; then
              # a breaking change is listed once, under Breaking Changes, whatever its type
              BREAKING="${BREAKING}- ${description}"$'\n'
              [ -n "$breaking_footer" ] && BREAKING="${BREAKING}  ${breaking_footer}"$'\n'
              continue
            fi

            case "$type" in
              feat) FEATURES="${FEATURES}- ${description}"$'\n' ;;
              fix) FIXES="${FIXES}- ${description}"$'\n' ;;
            esac
          done < <(git log "$RANGE" --no-merges -z --pretty=tformat:'%s%n%b')

          {
            if [ -n "$BREAKING" ]; then
              echo "## Breaking Changes"
              printf '%s' "$BREAKING"
              echo ""
            fi
            if [ -n "$FEATURES" ]; then
              echo "## What's New"
              printf '%s' "$FEATURES"
              echo ""
            fi
            if [ -n "$FIXES" ]; then
              echo "## Bug Fixes"
              printf '%s' "$FIXES"
              echo ""
            fi
            if [ -z "${BREAKING}${FEATURES}${FIXES}" ]; then
              echo "No notable changes."
            fi
          } > release_notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file release_notes.md \
            dist/*.jar
